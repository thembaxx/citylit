name: Format procedural landmark implementation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-procedural-temporary.yml"
      - "lib/procedural-landmarks.js"
      - "components/ProceduralStageModel.tsx"
      - "tests/procedural-stage.spec.ts"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/procedural-r187-landmarks-places' && github.actor == 'thembaxx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --write lib/procedural-landmarks.js components/ProceduralStageModel.tsx tests/procedural-stage.spec.ts
      - name: Commit formatting to this feature branch
        run: |
          git config user.name "citylit-format-bot"
          git config user.email "citylit-format-bot@users.noreply.github.com"
          git add -- lib/procedural-landmarks.js components/ProceduralStageModel.tsx tests/procedural-stage.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format procedural landmark implementation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
