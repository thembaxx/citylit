name: Architectural visual benchmark (one shot)
on:
  push:
    branches:
      - feat/archviz-quality-benchmark
    paths:
      - .github/workflows/archviz-benchmark-once.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: feat/archviz-quality-benchmark
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit source
        run: |
          pnpm format
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib scripts tests
          if ! git diff --cached --quiet; then
            git commit -m "style(archviz): apply repository Oxfmt formatting"
            git fetch origin feat/archviz-quality-benchmark
            git rebase origin/feat/archviz-quality-benchmark
            git push origin HEAD:feat/archviz-quality-benchmark
          fi
      - name: Verify production build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture actual 3D scene
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/archviz-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/kimberley/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-archviz.mjs
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archviz-museum-desktop-mobile
          path: artifacts/archviz/
          if-no-files-found: warn
          retention-days: 7
