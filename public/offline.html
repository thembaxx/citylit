<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#080f20" media="(prefers-color-scheme: dark)"><meta name="color-scheme" content="dark light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Citylit"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Citylit · Your sparks travel with you</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/app-icon.svg"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><link rel="stylesheet" href="/offline.css">
</head>
<body>
<main>
<header class="offline-top"><a href="/"><svg class="ui-symbol" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#arrow-left"></use></svg> Return to Citylit</a><button id="theme" aria-label="Switch theme">Day / night</button></header>
<header class="offline-welcome"><img src="/brand/khwezi-offline.svg" alt="Khwezi resting beside a lantern"><div><small>EVERY CITY HAS A SPARK.</small><h1>Your sparks travel with you.</h1><p class="notice">A little curiosity, even without a signal.</p></div></header>
<p class="connection-note" id="connection" role="status"></p>
<div class="offline-filters"><label class="search-label">Find a discovery<input id="search" type="search" placeholder="Search places" autocomplete="off"></label><label>Destination<select id="city"><option value="all">All destinations</option></select></label><label>Chapter<select id="category"><option value="all">All categories</option></select></label></div>
<p class="notice">Descriptions, addresses and source details travel with you. Photos appear when downloaded; live 3D, street maps, tickets and directions need a connection.</p>
<p id="status" role="status"></p><p id="action-status" role="status"></p><div id="places"></div>
<noscript>This pocket guide needs JavaScript. Connect to read Citylit’s source-linked city guides.</noscript>
</main>
<nav class="offline-tabs" aria-label="Pocket guide collections"><button id="saved" aria-pressed="true"><svg class="ui-symbol" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#heart"></use></svg>Saved discoveries</button><button id="day" aria-pressed="false"><svg class="ui-symbol" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#sun"></use></svg>My day</button><button id="all" aria-pressed="false"><svg class="ui-symbol" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#compass"></use></svg>Browse cached places</button></nav>
<script src="/offline.js"></script>
</body></html>
