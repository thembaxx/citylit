name: Temporary PR93 test formatter
on:
  push:
    branches: [feat/visual-fidelity-five-landmarks-93]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[autoformat]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed landmark regression tests
        run: |
          pnpm exec oxfmt tests/landmark-mobile-budgets.spec.ts tests/procedural-stage.spec.ts
          git add tests/landmark-mobile-budgets.spec.ts tests/procedural-stage.spec.ts
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: normalize landmark mobile and screenshot tests [autoformat]"
            git push origin HEAD:feat/visual-fidelity-five-landmarks-93
          fi
