name: Review rebuilt museum render once
# Retry after TS narrowing fix; captures genuine Draco + PBR hero
on:
  push:
    branches:
      - feat/archviz-quality-benchmark
    paths:
      - .github/workflows/review-museum-render-once.yml
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and inspect 3D assets
        run: |
          node scripts/audit-stage-models.mjs
          pnpm typecheck
          pnpm build
      - name: Install headless chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture museum with real WebGL
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-render.log 2>&1 &
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:3000/kimberley/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-archviz.mjs
      - name: Upload four actual renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-museum-new-model-desktop-mobile
          path: artifacts/archviz/
          if-no-files-found: warn
          retention-days: 14
