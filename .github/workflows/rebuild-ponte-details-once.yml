name: Rebuild Ponte architectural facade relief (one shot)
on:
  push:
    branches:
      - feat/ponte-facade-detail
    paths:
      - .github/workflows/rebuild-ponte-details-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/ponte-facade-detail
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and image processors
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Rebuild all GLBs and verify Ponte physical detail
        run: |
          python3 -m py_compile scripts/sculpt-landmark-heroes.py
          pnpm models:build
          pnpm exec oxfmt scripts/audit-site-informed-models.mjs
          pnpm models:audit
      - name: Validate production build and source checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Persist only audited exported models and source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ scripts/.stage-pbr/ scripts/audit-site-informed-models.mjs
          if ! git diff --cached --quiet; then
            git commit -m "assets(archviz): bake Ponte facade depth and courtyard details"
            git push origin HEAD:feat/ponte-facade-detail
          fi
      - name: Capture actual Ponte facade on two viewports
        env:
          STAGE_FOCUS_IDS: ponte
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-ponte-facade.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/johannesburg/landmarks > /dev/null; then break; fi
            echo "Waiting for CityLit server $attempt"
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Preserve actual loaded WebGL screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-ponte-facade-depth-desktop-mobile
          path: artifacts/stage-pbr/
          retention-days: 14
          if-no-files-found: warn
