name: Temporary atlas formatter
on:
  push:
    branches: [feat/atlas-models-shaders-r187]
permissions:
  contents: write
jobs:
  format-atlas:
    if: "!contains(github.event.head_commit.message, '[autoformat]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format reviewed source files
        run: |
          pnpm exec oxfmt components/Scene.tsx components/AtlasProceduralModel.tsx lib/procedural-landmarks.js lib/stage-models.ts lib/procedural-atlas-categories.js lib/procedural-atlas-categories.d.ts tests/atlas-geometry.spec.ts
          git add components/Scene.tsx components/AtlasProceduralModel.tsx lib/procedural-landmarks.js lib/stage-models.ts lib/procedural-atlas-categories.js lib/procedural-atlas-categories.d.ts tests/atlas-geometry.spec.ts
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format expanded atlas models [autoformat]"
            git push origin HEAD:feat/atlas-models-shaders-r187
          fi
