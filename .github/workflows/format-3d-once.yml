name: Format 3D PR once
on:
  push:
    branches:
      - feat/premium-3d-landmark-inspector
    paths:
      - .github/workflows/format-3d-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: feat/premium-3d-landmark-inspector
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: git diff --check
      - name: Commit formatting to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(3d): apply repository Oxfmt formatting"
          git push origin HEAD:feat/premium-3d-landmark-inspector
