name: Format CityLit 3D source before final release (one shot)
on:
  push:
    branches:
      - feat/sculpt-remaining-ten-stage-assets
    paths:
      - .github/workflows/format-citylit-sculpts-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/sculpt-remaining-ten-stage-assets
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format all source and verify identical checked formatting
        run: pnpm format && pnpm format:check
      - name: Persist only automatic source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LandmarkRing.tsx scripts/compress-stage-models.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): apply Oxfmt to model readiness and tint pipeline"
            git fetch origin feat/sculpt-remaining-ten-stage-assets
            git rebase origin/feat/sculpt-remaining-ten-stage-assets
            git push origin HEAD:feat/sculpt-remaining-ten-stage-assets
          fi
