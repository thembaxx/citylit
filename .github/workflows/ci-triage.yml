# workflow_run only reads workflow metadata; never checks out or executes PR code.
name: CI failure triage
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Refresh public catalog for review
      - Production uptime
      - Deployment smoke
      - Security
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  triage:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: thembaxx/thembaxx/.github/workflows/ci-triage-reusable.yml@6d96126bb64ae4357cecf16f77a054f272cd037
    with:
      run_id: ${{ github.event.workflow_run.id }}
      workflow_name: ${{ github.event.workflow_run.name }}
