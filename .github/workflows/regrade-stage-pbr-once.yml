name: Regrade CityLit PBR colours and prove rendered 3D (one shot)
on:
  push:
    branches:
      - feat/sculpt-remaining-ten-stage-assets
    paths:
      - .github/workflows/regrade-stage-pbr-once.yml
permissions:
  contents: write
jobs:
  restore-colours:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/sculpt-remaining-ten-stage-assets
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recompress all existing geometry with stable authored colour factors
        run: |
          node scripts/compress-stage-models.mjs
          pnpm models:audit
          pnpm site-models:audit
      - name: Commit the verified corrected self-contained GLBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/
          if ! git diff --cached --quiet; then
            git commit -m "assets(3d): preserve coloured facade and landscape tints"
            git fetch origin feat/sculpt-remaining-ten-stage-assets
            git rebase origin/feat/sculpt-remaining-ten-stage-assets
            git push origin HEAD:feat/sculpt-remaining-ten-stage-assets
          fi
      - name: Verify production and format with corrected model binaries
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Confirm decoded GLBs visually in all ten scenes on two viewports
        env:
          STAGE_FOCUS_IDS: bridge,lighthouse,park,dome,tower,arch,fort,bo-kaap,cooling-towers,aquarium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-regraded.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Preserve actual rendered asset previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-regraded-ten-real-models
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 10
