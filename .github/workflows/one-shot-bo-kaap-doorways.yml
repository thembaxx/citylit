name: Bo-Kaap physical doorway rebuild and visual QA
# Visual QA revision 2: shallow timber setback and physically shaded jambs.
on:
  push:
    branches:
      - feat/archviz-bo-kaap-real-entry-depth-2026-11
    paths:
      - .github/workflows/one-shot-bo-kaap-doorways.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bo-kaap-doorway-artifacts
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and local image tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
          blender --version | head -n 2
      - name: Preserve original comparison assets
        run: |
          cp public/models/stage/bo-kaap.glb /tmp/citylit-bo-kaap-original.glb
          cp public/models/stage/manifest.json /tmp/citylit-manifest-original.json
      - name: Rebuild and audit real recessed terrace doors
        run: |
          python3 -m py_compile scripts/recessed-architecture.py scripts/architectural-detail-pass.py
          pnpm models:build
          pnpm models:audit
          pnpm lint
          pnpm typecheck
          pnpm format:check
          pnpm build
          cp public/models/stage/bo-kaap.glb /tmp/citylit-bo-kaap-new.glb
          cp public/models/stage/manifest.json /tmp/citylit-manifest-new.json
      - name: Compare genuine before/after WebGL rendering
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 >/tmp/citylit-preview.log 2>&1 &
          server_pid=$!
          trap 'cp /tmp/citylit-bo-kaap-new.glb public/models/stage/bo-kaap.glb; kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null
          cp /tmp/citylit-bo-kaap-original.glb public/models/stage/bo-kaap.glb
          STAGE_FOCUS_IDS=bo-kaap STAGE_CAPTURE_DIR=artifacts/bo-kaap/before node scripts/capture-stage-catalog.mjs
          STAGE_FOCUS_IDS=bo-kaap STAGE_MOBILE_WIDTH=320 STAGE_MOBILE_HEIGHT=720 STAGE_CAPTURE_DIR=artifacts/bo-kaap/before-320 node scripts/capture-stage-catalog.mjs
          cp /tmp/citylit-bo-kaap-new.glb public/models/stage/bo-kaap.glb
          STAGE_FOCUS_IDS=bo-kaap STAGE_CAPTURE_DIR=artifacts/bo-kaap/after node scripts/capture-stage-catalog.mjs
          STAGE_FOCUS_IDS=bo-kaap STAGE_MOBILE_WIDTH=320 STAGE_MOBILE_HEIGHT=720 STAGE_CAPTURE_DIR=artifacts/bo-kaap/after-320 node scripts/capture-stage-catalog.mjs
      - name: Commit only the rebuilt Bo-Kaap asset and its manifest entry
        shell: bash
        run: |
          set -euo pipefail
          git restore -- public/models/stage/
          cp /tmp/citylit-bo-kaap-new.glb public/models/stage/bo-kaap.glb
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const original=JSON.parse(readFileSync('/tmp/citylit-manifest-original.json','utf8'));
          const generated=JSON.parse(readFileSync('/tmp/citylit-manifest-new.json','utf8'));
          const next=generated.find(item=>item.id==='bo-kaap');
          if(!next || next.bytes<1000) throw new Error('Invalid regenerated Bo-Kaap manifest entry');
          const index=original.findIndex(item=>item.id==='bo-kaap');
          if(index<0) throw new Error('Original manifest missing Bo-Kaap entry');
          original[index]={...original[index],...next};
          writeFileSync('public/models/stage/manifest.json',JSON.stringify(original,null,2)+'\n');
          console.log('Bo-Kaap bytes:',next.bytes,'other model metadata preserved');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/bo-kaap.glb public/models/stage/manifest.json
          git diff --cached --check
          git diff --cached --quiet && { echo "Model unchanged; no artifact commit needed"; exit 1; }
          git commit -m "feat(archviz): deliver rebuilt physical Bo-Kaap entryway GLB"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Preserve ready-state comparison screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bo-kaap-entryway-before-after-1440-390-320
          path: artifacts/bo-kaap/
          if-no-files-found: warn
          retention-days: 7
