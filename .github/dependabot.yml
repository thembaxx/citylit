version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      production-patches:
        dependency-type: production
        update-types: [minor, patch]
      tooling-patches:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /scripts
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
