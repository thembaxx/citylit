name: Rebuild real architectural window interiors (one shot)
on:
  push:
    branches:
      - feat/citylit-real-window-depth
    paths:
      - .github/workflows/build-recessed-architecture-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/citylit-real-window-depth
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install original mesh-authoring tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Regenerate complete geometry and verify carved rooms
        run: |
          python3 -m py_compile scripts/sculpt-remaining-assets.py scripts/recessed-architecture.py scripts/build-landmark-models.py
          pnpm models:build
          pnpm models:audit
          node scripts/audit-recessed-architecture.mjs
      - name: Validate quality and production build
        run: |
          pnpm exec oxfmt components/StageModel.tsx scripts/audit-recessed-architecture.mjs
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Persist only audited Blender binaries and sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ scripts/.stage-pbr/ components/StageModel.tsx scripts/audit-recessed-architecture.mjs
          if ! git diff --cached --quiet; then
            git commit -m "assets(archviz): embed real carved windows and miniature rooms"
            git push origin HEAD:feat/citylit-real-window-depth
          fi
      - name: Capture real Bo-Kaap and civic buildings on desktop and mobile
        env:
          STAGE_FOCUS_IDS: bo-kaap,tower,dome
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-interiors.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            echo "Waiting for CityLit boot attempt $attempt"
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Preserve loaded-geometry visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-carved-interior-depth-desktop-mobile
          path: artifacts/stage-pbr/
          retention-days: 14
          if-no-files-found: warn
