name: Temporary teachable-figure format preview
on:
  push:
    branches:
      - feature/teachable-figure-visit-budget
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - name: Format and emit changed file contents
        run: |
          ./node_modules/.bin/oxfmt --write components/VisitBudgetFigure.tsx components/VisitBudgetFigure.module.css components/PlanVisit.tsx components/PlacesBrowser.tsx lib/visit-budget-figure.ts tests/quiet-interface.spec.ts tests/visit-budget-figure.spec.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ["components/VisitBudgetFigure.tsx","components/VisitBudgetFigure.module.css","components/PlanVisit.tsx","components/PlacesBrowser.tsx","lib/visit-budget-figure.ts","tests/quiet-interface.spec.ts","tests/visit-budget-figure.spec.ts"]:
              print("FMT_RESULT|" + name + "|" + json.dumps(Path(name).read_text(), ensure_ascii=True))
          PY
