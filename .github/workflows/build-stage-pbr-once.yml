name: Build textured CityLit landmark catalog once
# Retry with 320px preoptimized CC0 JPEG material maps
on:
  push:
    branches:
      - feat/archviz-all-assets
    paths:
      - .github/workflows/build-stage-pbr-once.yml
permissions:
  contents: write
jobs:
  build-pbr:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/archviz-all-assets
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender/NumPy/Pillow
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Download verified CC0 PBR scans and rebuild fifteen miniatures
        run: |
          python3 scripts/fetch-museum-pbr.py
          pnpm models:build
          pnpm models:audit
      - name: Commit regenerated CC0 textured GLBs and manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(archviz): ship fifteen UV-mapped CC0 PBR landmark GLBs"
          git fetch origin feat/archviz-all-assets
          git rebase origin/feat/archviz-all-assets
          git push origin HEAD:feat/archviz-all-assets
      - name: Validate source and production build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test all stage assets and camera interactions
        run: pnpm exec playwright test tests/all-3d-landmarks.spec.ts --project=desktop-chromium --workers=2
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage-pbr-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
