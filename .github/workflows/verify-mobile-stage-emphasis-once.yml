name: Verify mobile 3D landmark scale (one shot)
on:
  push:
    branches:
      - feat/mobile-stage-visual-emphasis
    paths:
      - .github/workflows/verify-mobile-stage-emphasis-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      STAGE_FOCUS_IDS: ponte,union-buildings,stadium,bo-kaap,tower,table-mountain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/mobile-stage-visual-emphasis
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and verify production source
        run: |
          pnpm exec oxfmt components/LandmarkRing.tsx scripts/capture-stage-catalog.mjs tests/stages.spec.ts app/discovery-guide.css
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm models:audit
          pnpm build
      - name: Commit formatter adjustments if required
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LandmarkRing.tsx scripts/capture-stage-catalog.mjs tests/stages.spec.ts app/discovery-guide.css
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format responsive stage and capture controls"
            git push origin HEAD:feat/mobile-stage-visual-emphasis
          fi
      - name: Verify actual WebGL models at desktop, 390 and 320
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-stage-scale.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/johannesburg/landmarks > /dev/null; then break; fi
            sleep 1
          done
          STAGE_CAPTURE_DIR=artifacts/stage-390 node scripts/capture-stage-catalog.mjs
          STAGE_CAPTURE_DIR=artifacts/stage-320 STAGE_MOBILE_WIDTH=320 STAGE_MOBILE_HEIGHT=720 node scripts/capture-stage-catalog.mjs
      - name: Existing stage browser interactions
        run: |
          CI= pnpm exec playwright test tests/stages.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Retain true application screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-stage-responsive-320-390-desktop
          path: artifacts/stage-*/
          retention-days: 14
          if-no-files-found: warn
