name: Capture verified CityLit ten-model desktop/mobile frames (one shot)
on:
  push:
    branches:
      - feat/sculpt-remaining-ten-stage-assets
    paths:
      - .github/workflows/capture-ready-ten-once.yml
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format && pnpm lint && pnpm typecheck && pnpm models:audit && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Confirm real decoded GLBs and capture desktop/mobile WebGL
        env:
          STAGE_FOCUS_IDS: bridge,lighthouse,park,dome,tower,arch,fort,bo-kaap,cooling-towers,aquarium
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-ready-models.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Save verified screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loaded-citylit-ten-models-desktop-mobile
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 10
