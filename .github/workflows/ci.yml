name: CI
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  quality:
    name: quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm data:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:monitor
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m pip install --require-hashes -r scripts/requirements.txt
      - name: Ingestion and image security regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - run: pnpm build
      - name: Share this exact production build with browser checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-build
          path: |
            .next/
            !.next/cache/**
            public/pwa-release.js
            public/icons/ui.svg
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  browsers:
    name: ${{ matrix.project }} ${{ matrix.part }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-chromium
            engine: chromium
            part: 1
            shard: 1/2
          - project: mobile-chromium
            engine: chromium
            part: 2
            shard: 2/2
          - project: desktop-chromium
            engine: chromium
            part: 1
            shard: 1/2
          - project: desktop-chromium
            engine: chromium
            part: 2
            shard: 2/2
          - project: mobile-webkit-theme
            engine: webkit
            part: 1
            shard: 1/1
          - project: desktop-firefox-theme
            engine: firefox
            part: 1
            shard: 1/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: production-build
          path: .
      - name: Install this project's browser
        run: pnpm exec playwright install --with-deps "$BROWSER_ENGINE"
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Browser regression tests
        run: pnpm exec playwright test --project="$BROWSER_PROJECT" --shard="$BROWSER_SHARD"
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SHARD: ${{ matrix.shard }}
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-diagnostics-${{ matrix.project }}-${{ matrix.part }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: verify
    if: always()
    needs: [quality, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every build and browser check
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
