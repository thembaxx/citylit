name: Verify botanical stage geometry (one shot)
on:
  push:
    branches:
      - feat/park-botanical-fidelity-2026-11
    paths:
      - .github/workflows/verify-botanical-fidelity-once.yml
permissions:
  contents: write
jobs:
  author-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      STAGE_FOCUS_IDS: park
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/park-botanical-fidelity-2026-11
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and PBR scan processor
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Build all fifteen GLBs and verify botanical geometry
        run: |
          python3 -m py_compile scripts/botanical-fidelity.py scripts/sculpt-remaining-assets.py scripts/build-landmark-models.py
          pnpm models:build
          pnpm exec oxfmt components/StageModel.tsx scripts/audit-site-informed-models.mjs
          pnpm models:audit
      - name: Production checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Commit only verified binary models and source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ scripts/.stage-pbr/ components/StageModel.tsx scripts/audit-site-informed-models.mjs
          if ! git diff --cached --quiet; then
            git commit -m "assets(3d): bake curved botanical foliage and garden groundcover"
            git push origin HEAD:feat/park-botanical-fidelity-2026-11
          fi
      - name: Render ready-state park at 1440, 390 and 320
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-botanic-review.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/durban/landmarks > /dev/null; then break; fi
            sleep 1
          done
          STAGE_CAPTURE_DIR=artifacts/park-390 node scripts/capture-stage-catalog.mjs
          STAGE_CAPTURE_DIR=artifacts/park-320 STAGE_MOBILE_WIDTH=320 STAGE_MOBILE_HEIGHT=720 node scripts/capture-stage-catalog.mjs
      - name: Preserve actual 3D renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-botanical-fidelity-desktop-mobile
          path: artifacts/park-*/
          retention-days: 14
          if-no-files-found: warn
