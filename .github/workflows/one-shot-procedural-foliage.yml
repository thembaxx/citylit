name: One-shot procedural foliage visual QA
on:
  push:
    branches:
      - feat/procedural-lamina-foliage-2026-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Capture ready-state classic foliage and landmark stage
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-visual.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          node scripts/capture-procedural-foliage.mjs
      - name: Preserve actual WebGL visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-procedural-foliage-desktop-mobile
          path: artifacts/procedural-foliage/
          retention-days: 7
          if-no-files-found: warn
