<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#091323"><title>Citylit · offline field guide</title><style>body{font:16px/1.6 system-ui;margin:0;background:#091323;color:#f3f0e8}main{max-width:780px;margin:auto;padding:28px}a{color:#bcb7ff}h1{font-size:38px;line-height:1.1}article{border:1px solid #35425b;border-radius:24px;padding:22px;margin:18px 0;background:#101b32}button{font:inherit;background:#aaa5ff;border:0;border-radius:18px;padding:12px;color:#091323;cursor:pointer}img{max-width:100%;border-radius:20px}small{display:block;color:#bcc2d1}nav{display:flex;gap:12px;flex-wrap:wrap}@supports(corner-shape:squircle){article,img,button{corner-shape:squircle}}.notice{color:#bcc2d1}:root[data-theme=day] body{background:#f5f3eb;color:#172238}:root[data-theme=day] article{background:#fffdf8;border-color:#b3bfd0}:root[data-theme=day] small,:root[data-theme=day] .notice{color:#526381}:root[data-theme=day] a{color:#5743ce}</style></head><body><main><a href="/">← Return to Citylit</a><h1>Your pocket field guide.</h1><p class="notice">Saved descriptions, addresses and source details are available after saving your field guide. Live street maps, tickets and directions need a connection.</p><nav><button id="saved">Saved discoveries</button><button id="day">My day</button><button id="all">Browse cached places</button></nav><p id="status" role="status"></p><div id="places"></div></main><script>
try{document.documentElement.dataset.theme=localStorage.getItem('citylit-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'day':'night');}catch{}
let places=[],state={saved:[],itinerary:[]};try{state=JSON.parse(localStorage.getItem('citylit-discovery-v2')||'{}');if(!state.saved)state.saved=JSON.parse(localStorage.getItem('mzansi-saved')||'[]');}catch{}
const container=document.getElementById('places'),status=document.getElementById('status');
const element=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node;};
function show(mode){container.replaceChildren();const pathId=decodeURIComponent(location.pathname.split('/').pop());const hash=decodeURIComponent(location.hash.slice(1))||(places.some(p=>p.id===pathId)?pathId:'');let list=hash?places.filter(p=>p.id===hash):mode==='all'?places:places.filter(p=>(mode==='day'?state.itinerary:state.saved||[]).includes(p.id));if(mode==='day')list.sort((a,b)=>state.itinerary.indexOf(a.id)-state.itinerary.indexOf(b.id));status.textContent=list.length+' cached discoveries';for(const place of list){const card=element('article','');card.id=place.id;card.append(element('small',place.category+' · '+place.city.replaceAll('-',' ')),element('h2',place.name),element('p',place.description),element('p',place.address));if(place.images[0]){const image=document.createElement('img');image.src=place.images[0].src;image.alt=place.images[0].alt;image.loading='lazy';image.onerror=()=>image.remove();card.append(image);card.append(element('small',place.images[0].author+' · '+place.images[0].license+' · '+(place.imageContext==='venue'?'Venue photo':'City atmosphere')));}if(place.about){card.append(element('h3','About'),element('p',place.about));if(place.wikipedia){const wiki=element('a','Wikipedia contributors · CC BY-SA 4.0');wiki.href=place.wikipedia;card.append(wiki);}}for(const [key,fact] of Object.entries(place.facts||{})){if(fact.value===null)continue;card.append(element('small',key.replace(/([A-Z])/g,' $1')+': '+fact.value+' · '+fact.confidence));}card.append(element('small','Checked '+place.checkedAt+' · '+(place.coordinateAccuracy==='venue'?'Venue pin':'City reference pin')));const link=element('a','Venue website ↗');link.href=place.website;card.append(link);container.append(card);}if(!list.length)container.append(element('p','No places in this collection yet. Save discoveries while online, then download your field guide.'));}
fetch('/data/places.json').then(r=>r.json()).then(data=>{places=data;show('saved');}).catch(()=>{status.textContent='No cached guide yet. Connect once and choose Save field guide offline in your passport.';});for(const mode of ['saved','day','all'])document.getElementById(mode).onclick=()=>{history.replaceState(null,'',location.pathname);show(mode);};
</script></body></html>
