name: Verify architectural contact and focused scene (temporary)
on:
  push:
    branches:
      - feat/archviz-quality-benchmark
    paths:
      - .github/workflows/verify-archviz-grounding-once.yml
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/archviz-quality-benchmark
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting to hero changes
        run: |
          pnpm format
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components app scripts tests
          if ! git diff --cached --quiet; then
            git commit -m "style(archviz): format museum contact and presentation changes"
            git fetch origin feat/archviz-quality-benchmark
            git rebase origin/feat/archviz-quality-benchmark
            git push origin HEAD:feat/archviz-quality-benchmark
          fi
      - name: Verify source and asset
        run: |
          pnpm lint
          pnpm typecheck
          pnpm hero:audit
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Record real reference-facing renders
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-archviz.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/kimberley/landmarks >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-archviz.mjs
      - name: Upload four images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-final-grounding-comparison
          path: artifacts/archviz/
          if-no-files-found: warn
          retention-days: 10
