name: Rebuild Union Buildings carved interiors (one shot)
on:
  push:
    branches:
      - feat/union-buildings-recessed-windows
    paths:
      - .github/workflows/rebuild-union-rooms-once.yml
      - scripts/recessed-architecture.py
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/union-buildings-recessed-windows
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and locally available material processors
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Regenerate all 15 GLBs and verify Union window depth
        run: |
          python3 -m py_compile scripts/sculpt-landmark-heroes.py scripts/recessed-architecture.py scripts/build-landmark-models.py
          pnpm models:build
          pnpm models:audit
      - name: Verify code and production build
        run: |
          # The earlier porcelain-plinth commit left this one audit unformatted.
          pnpm exec oxfmt scripts/audit-site-informed-models.mjs
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Commit tested 3D assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ scripts/.stage-pbr/ scripts/audit-site-informed-models.mjs
          if ! git diff --cached --quiet; then
            git commit -m "assets(3d): bake Union Buildings carved window room geometry"
            git push origin HEAD:feat/union-buildings-recessed-windows
          fi
      - name: Capture actual Pretoria building at desktop and mobile
        env:
          STAGE_FOCUS_IDS: union-buildings
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-union-interiors.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/pretoria/landmarks > /dev/null; then break; fi
            echo "Waiting for CityLit boot attempt $attempt"
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Preserve actual ready-state screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-union-buildings-window-depth
          path: artifacts/stage-pbr/
          retention-days: 14
          if-no-files-found: warn
