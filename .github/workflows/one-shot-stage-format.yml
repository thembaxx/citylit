name: One-shot CityLit stage formatting
on:
  push:
    branches:
      - feat/mobile-native-brand-refresh-2026-11
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format test with repository-pinned Oxfmt
        run: |
          pnpm exec oxfmt tests/stages.spec.ts
          mkdir -p artifacts/formatted/tests
          cp tests/stages.spec.ts artifacts/formatted/tests/stages.spec.ts
      - name: Upload formatted test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-formatted-stage-test
          path: artifacts/formatted/tests/stages.spec.ts
          if-no-files-found: error
          retention-days: 2
