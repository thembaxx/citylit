name: Build site-accurate CityLit landmarks (one shot)
on:
  push:
    branches:
      - feat/citylit-premium-asset-fidelity
    paths:
      - .github/workflows/build-accurate-landmarks-once.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/citylit-premium-asset-fidelity
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and image processors
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Regenerate local geometric assets and validate geometry
        run: |
          python3 -m py_compile scripts/*.py
          pnpm models:build
          pnpm models:audit
          pnpm site-models:audit
      - name: Validate architecture code and production build
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Commit complete tested Blender outputs to this draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ scripts/.stage-pbr/
          if ! git diff --cached --quiet; then
            git commit -m "assets(3d): rebuild architecture-specific city models"
            git fetch origin feat/citylit-premium-asset-fidelity
            git rebase origin/feat/citylit-premium-asset-fidelity
            git push origin HEAD:feat/citylit-premium-asset-fidelity
          fi
      - name: Capture actual WebGL geometry in every stage at desktop and mobile
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-site-accuracy.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            echo "Waiting for app boot attempt $attempt"
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Upload desktop and mobile comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-accurate-citylit-desktop-mobile
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 14
