name: Temporary PR93 formatter
on:
  push:
    branches: [feat/visual-fidelity-five-landmarks-93]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[autoformat]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PR93 sources and existing CI
        run: |
          pnpm exec oxfmt lib/procedural-landmarks.js lib/landmark-pbr.js lib/landmark-pbr.d.ts lib/landmark-budget.js lib/landmark-budget.d.ts tests/landmark-silhouette.spec.ts tests/landmark-mobile-budgets.spec.ts tests/landmark-visual-capture.spec.ts .github/workflows/ci.yml
          git add lib/procedural-landmarks.js lib/landmark-pbr.js lib/landmark-pbr.d.ts lib/landmark-budget.js lib/landmark-budget.d.ts tests/landmark-silhouette.spec.ts tests/landmark-mobile-budgets.spec.ts tests/landmark-visual-capture.spec.ts .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: format PR93 with project Oxfmt [autoformat]"
            git push origin HEAD:feat/visual-fidelity-five-landmarks-93
          fi
