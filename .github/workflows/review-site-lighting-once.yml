name: Verify sculpted landmark studio lighting (temporary)
on:
  push:
    branches:
      - feat/site-specific-landmark-sculpts
    paths:
      - .github/workflows/review-site-lighting-once.yml
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/site-specific-landmark-sculpts
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scene code and commit if required
        run: |
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components scripts
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): normalize shared contact and studio lighting code"
            git fetch origin feat/site-specific-landmark-sculpts
            git rebase origin/feat/site-specific-landmark-sculpts
            git push origin HEAD:feat/site-specific-landmark-sculpts
          fi
      - name: Validate all 15 models and final built source
        run: |
          pnpm models:audit
          pnpm site-models:audit
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture focused landmark screenshots
        env:
          STAGE_FOCUS_IDS: ponte,stadium,union-buildings,table-mountain,hole
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/site-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/pretoria/landmarks >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Attach real desktop and mobile frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-specific-contrast-comparison
          path: artifacts/stage-pbr/
          retention-days: 10
          if-no-files-found: warn
