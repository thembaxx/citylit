name: Focused 3D formatting (temporary)
on:
  push:
    branches:
      - feat/procedural-normal-mapping-nov26
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the affected files
        run: pnpm exec oxfmt lib/landmark-pbr.js tests/landmark-mobile-budgets.spec.ts
      - name: Commit format-only correction to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add lib/landmark-pbr.js tests/landmark-mobile-budgets.spec.ts
            git commit -m 'style: format procedural landmark normal maps'
            git push origin HEAD:feat/procedural-normal-mapping-nov26
          fi
