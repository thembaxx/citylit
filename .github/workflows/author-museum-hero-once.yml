name: Build realistic McGregor Museum GLB once
on:
  push:
    branches:
      - feat/archviz-quality-benchmark
    paths:
      - .github/workflows/author-museum-hero-once.yml
permissions:
  contents: write
jobs:
  museum-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/archviz-quality-benchmark
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and NumPy for glTF exporter
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
          blender --version | head -1
      - name: Download and verify CC0 textures
        run: python3 scripts/fetch-museum-pbr.py
      - name: Model historic Kimberley museum in Blender
        run: blender --background --python-exit-code 1 --python scripts/build-museum-hero.py
      - name: Draco compression and material verification
        run: node scripts/compress-museum-hero.mjs
      - name: Commit only the generated hero asset and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/hero/
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(archviz): add real-material Victorian museum hero model"
          git fetch origin feat/archviz-quality-benchmark
          git rebase origin/feat/archviz-quality-benchmark
          git push origin HEAD:feat/archviz-quality-benchmark
