name: Capture all fifteen PBR landmark scenes once
# Final true-color focused hero capture at desktop and mobile sizes
# Retry after correcting the R3F canvas DOM selector
on:
  push:
    branches:
      - feat/archviz-all-assets
    paths:
      - .github/workflows/capture-stage-pbr-once.yml
permissions:
  contents: read
jobs:
  visual-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify model files and application
        run: |
          pnpm models:audit
          pnpm typecheck
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Render each of the fifteen model types in real Chromium
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-stage-capture.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Upload authentic 3D screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: citylit-15-pbr-landmark-renders
          path: artifacts/stage-pbr/
          retention-days: 10
          if-no-files-found: warn
