name: Verify civic facade orientation in real WebGL (one shot)
on:
  push:
    branches:
      - feat/citylit-premium-asset-fidelity
    paths:
      - .github/workflows/inspect-civic-facades-once.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm models:audit && pnpm format:check && pnpm lint && pnpm typecheck && pnpm build
      - name: Capture actual front elevations desktop and mobile
        env:
          STAGE_FOCUS_IDS: dome,tower,bo-kaap
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-facade.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            echo "Waiting for app boot attempt $attempt"
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Upload screenshot evidence for model review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-civic-facade-orientation
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 14
