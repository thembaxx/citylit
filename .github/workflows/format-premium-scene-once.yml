name: Format premium 3D scene (one shot)
on:
  push:
    branches:
      - feat/citylit-premium-asset-fidelity
    paths:
      - .github/workflows/format-premium-scene-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/citylit-premium-asset-fidelity
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply checked-in Oxfmt to changed premium scene source
        run: |
          pnpm exec oxfmt components/LandmarkRing.tsx scripts/compress-stage-models.mjs
          pnpm format:check
      - name: Persist formatting-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LandmarkRing.tsx scripts/compress-stage-models.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format architectural scene with Oxfmt"
            git fetch origin feat/citylit-premium-asset-fidelity
            git rebase origin/feat/citylit-premium-asset-fidelity
            git push origin HEAD:feat/citylit-premium-asset-fidelity
          fi
