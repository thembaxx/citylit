name: Rebuild CityLit high-detail stage materials (one shot)
on:
  push:
    branches:
      - feat/archviz-reference-materials
    paths:
      - .github/workflows/rebuild-reference-materials-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/archviz-reference-materials
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and material tooling
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Rebuild original meshes with full-resolution CC0 textures
        run: |
          python3 -m py_compile scripts/sculpt-remaining-assets.py scripts/stage-pbr.py scripts/prepare-stage-scans.py scripts/build-landmark-models.py
          python3 scripts/fetch-museum-pbr.py
          pnpm models:build
          pnpm models:audit
          pnpm site-models:audit
      - name: Check code, formatting, production build and WebGL regressions
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Capture all fifteen real models in desktop and mobile
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-archviz.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Persist successfully checked assets and formatted presentation code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ components/StageModel.tsx components/LandmarkRing.tsx scripts/prepare-stage-scans.py scripts/stage-pbr.py scripts/sculpt-remaining-assets.py
          if ! git diff --cached --quiet; then
            git commit -m "assets(archviz): regenerate all fifteen source-resolution studio models"
            git fetch origin feat/archviz-reference-materials
            git rebase origin/feat/archviz-reference-materials
            git push origin HEAD:feat/archviz-reference-materials
          fi
      - name: Preserve genuine WebGL screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-reference-materials-desktop-mobile
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 10
