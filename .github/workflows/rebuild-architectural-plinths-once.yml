name: Rebuild and compare CityLit architectural display plinths (one shot)
on:
  push:
    branches:
      - feat/citylit-architectural-plinths
    paths:
      - .github/workflows/rebuild-architectural-plinths-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/citylit-architectural-plinths
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and CC0 scan processors
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Rebuild all fifteen GLBs and verify depth and geometry
        run: |
          python3 -m py_compile scripts/build-landmark-models.py
          pnpm models:build
          pnpm models:audit
      - name: Verify app build and formatting
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Commit precisely audited model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/ scripts/.stage-pbr/
          if ! git diff --cached --quiet; then
            git commit -m "assets(archviz): rebuild neutral display plinths across stage catalog"
            git push origin HEAD:feat/citylit-architectural-plinths
          fi
      - name: Render representative buildings and terrain on desktop and mobile
        env:
          STAGE_FOCUS_IDS: bo-kaap,tower,dome,lighthouse,stadium,park
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-porcelain.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            echo "Waiting for app startup attempt $attempt"
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Preserve actual rendered comparison frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citylit-porcelain-architectural-plinths
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 14
