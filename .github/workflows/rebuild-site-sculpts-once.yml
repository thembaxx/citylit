name: Sculpt and visually audit five landmarks (one shot)
on:
  push:
    branches:
      - feat/site-specific-landmark-sculpts
    paths:
      - .github/workflows/rebuild-site-sculpts-once.yml
permissions:
  contents: write
jobs:
  sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/site-specific-landmark-sculpts
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and scanned-material tooling
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Produce five site-informed and ten unchanged PBR models
        run: |
          python3 scripts/fetch-museum-pbr.py
          pnpm models:build
          pnpm models:audit
          pnpm site-models:audit
      - name: Commit only verified model binaries and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/
          if ! git diff --cached --quiet; then
            git commit -m "assets(3d): ship five bespoke SA landmark topology sculpts"
            git fetch origin feat/site-specific-landmark-sculpts
            git rebase origin/feat/site-specific-landmark-sculpts
            git push origin HEAD:feat/site-specific-landmark-sculpts
          fi
      - name: Format and validate typed application code
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Persist formatting-only updates
        run: |
          git add app components lib scripts tests
          if ! git diff --cached --quiet; then
            git commit -m "style(3d): format site-specific sculpt tools"
            git fetch origin feat/site-specific-landmark-sculpts
            git rebase origin/feat/site-specific-landmark-sculpts
            git push origin HEAD:feat/site-specific-landmark-sculpts
          fi
      - name: Install Chromium for visual evidence
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture five unique sculpts on desktop and mobile
        env:
          STAGE_FOCUS_IDS: ponte,stadium,union-buildings,table-mountain,hole
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-site-sculpts.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Upload actual WebGL frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-informed-5-landmarks-desktop-mobile
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 10
