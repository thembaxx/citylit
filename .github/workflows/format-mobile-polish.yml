name: Temporary CityLit mobile CSS formatter
on:
  push:
    branches: [ui/mobile-native-polish-20261104]
    paths:
      - .github/workflows/format-mobile-polish.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'thembaxx/citylit' && github.ref == 'refs/heads/ui/mobile-native-polish-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          set -euo pipefail
          pnpm exec oxfmt --write app/mobile-ux.css
          git add -- app/mobile-ux.css
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format mobile inspector guardrails'
            git push origin HEAD:ui/mobile-native-polish-20261104
          fi
