name: Rebuild remaining ten CityLit 3D stage models (one shot)
on:
  push:
    branches:
      - feat/sculpt-remaining-ten-stage-assets
    paths:
      - .github/workflows/rebuild-remaining-ten-once.yml
permissions:
  contents: write
jobs:
  sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/sculpt-remaining-ten-stage-assets
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Blender and Python image processing tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil
      - name: Regenerate and structurally verify all fifteen GLBs
        run: |
          python3 -m py_compile scripts/sculpt-remaining-assets.py scripts/build-landmark-models.py
          python3 scripts/fetch-museum-pbr.py
          pnpm models:build
          pnpm models:audit
          pnpm site-models:audit
      - name: Persist regenerated assets only after Blender and GLB audits succeed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/stage/
          if ! git diff --cached --quiet; then
            git commit -m "assets(3d): rebuild ten original stage sculpts"
            git fetch origin feat/sculpt-remaining-ten-stage-assets
            git rebase origin/feat/sculpt-remaining-ten-stage-assets
            git push origin HEAD:feat/sculpt-remaining-ten-stage-assets
          fi
      - name: Validate code and production build
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Capture real desktop and mobile comparison frames
        env:
          STAGE_FOCUS_IDS: bridge,lighthouse,park,dome,tower,arch,fort,bo-kaap,cooling-towers,aquarium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start --hostname 127.0.0.1 > /tmp/citylit-remaining-sculpts.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/cape-town/landmarks > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-stage-catalog.mjs
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ten-citylit-stage-models-desktop-mobile
          path: artifacts/stage-pbr/
          if-no-files-found: warn
          retention-days: 10
